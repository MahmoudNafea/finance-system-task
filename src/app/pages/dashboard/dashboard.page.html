<main
  class="dashboard"
  [class.dashboard--requests]="activeTab === 'طلب مشتريات'"
  [class.dashboard--dark]="darkMode()"
  [attr.data-theme]="darkMode() ? 'dark' : 'light'"
  dir="rtl"
>
  <app-dashboard-header [darkMode]="darkMode()" (themeToggle)="toggleTheme()" />

  <div class="dashboard__body">
    <app-sidebar-navigation />

    <section class="dashboard__main" aria-label="محتوى لوحة القيادة">
      <app-dashboard-tabs [tabs]="tabs" [activeTab]="activeTab" (tabChange)="activeTab = $event" />

      @if (activeTab === 'طلب مشتريات') {
        <app-purchase-requests />
      } @else {
      <div class="dashboard__summary-carousel">
        <button type="button" class="dashboard__summary-arrow dashboard__summary-arrow--right" aria-label="البطاقات التالية" (click)="scrollSummaries(1)">‹</button>
        <section #summaryScroller class="dashboard__summary" aria-label="ملخص الميزانية">
          @for (summary of summaries; track summary.label) {
            <app-summary-card
              [label]="summary.label"
              [value]="summary.value"
              [trend]="summary.trend"
              [positive]="summary.positive"
              [icon]="summary.icon"
            />
          }
        </section>
        <button type="button" class="dashboard__summary-arrow dashboard__summary-arrow--left" aria-label="البطاقات السابقة" (click)="scrollSummaries(-1)">›</button>
      </div>

      <app-operations-table />

      <section class="dashboard__insights" aria-label="ملخص الأنشطة والمشتريات">
        <app-recent-activities />
        <app-purchase-status />
      </section>

      <section class="dashboard__data-tables" aria-label="المعاملات الأخيرة والمستودعات">
        <app-dashboard-data-table kind="processes" />
        <app-dashboard-data-table kind="stocks" />
      </section>

      <section class="dashboard__final-row" aria-label="العقود وبنود الموازنة">
        <app-contracts-table />
        <app-budget-items />
      </section>
      }
    </section>
  </div>
</main>
