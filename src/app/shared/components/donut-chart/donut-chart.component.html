<div class="donut-chart" role="img" [attr.aria-label]="ariaLabel()">
  <apx-chart
    [series]="series()"
    [chart]="chart"
    [labels]="labels()"
    [colors]="colors()"
    [plotOptions]="plotOptions"
    [stroke]="stroke"
    [dataLabels]="dataLabels"
    [legend]="legend"
    [tooltip]="tooltip"
  />
  <div class="donut-chart__center">
    <strong>{{ total() }}</strong>
    <span>{{ centerLabel() }}</span>
  </div>
</div>
