<div class="bar-chart" role="img">
  <apx-chart
    [series]="series()"
    [chart]="chart"
    [colors]="colors"
    [dataLabels]="dataLabels"
    [legend]="legend"
    [stroke]="stroke"
    [tooltip]="tooltip"
    [plotOptions]="plotOptions"
    [xaxis]="xaxis()"
    [yaxis]="yaxis()"
    [grid]="grid"
  />
</div>
