<article class="summary-card">
  <div class="summary-card__body">
    <span class="summary-card__icon" aria-hidden="true">
      @switch (icon()) {
        @case ('wallet') {
          <svg class="summary-card__icon-svg summary-card__icon-svg--wallet" viewBox="0 0 24 24">
            <path class="solid" d="M5 4h12a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/>
            <path class="cutout" d="M14 11h8v5h-8a2.5 2.5 0 0 1 0-5Z"/>
            <circle class="solid" cx="15" cy="13.5" r="1"/>
          </svg>
        }
        @case ('approved') {
          <svg class="summary-card__icon-svg summary-card__icon-svg--approved" viewBox="0 0 24 24">
            <path class="solid" d="M8 6V4h8v2h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4Zm2 0h4V5h-4v1Z"/>
            <path class="check" d="m7.5 13 3 3 6-6"/>
          </svg>
        }
        @default {
          <svg class="summary-card__icon-svg summary-card__icon-svg--document" viewBox="0 0 24 24">
            <path class="back" d="M3 7v12M6 4v15"/>
            <path class="solid" d="M8 2h8l5 5v13a2 2 0 0 1-2 2H8V2Z"/>
            <path class="fold" d="M16 2v5h5"/>
          </svg>
        }
      }
    </span>
    <div class="summary-card__copy">
      <p>{{ label() }}</p>
      <strong>{{ value() }}</strong>
    </div>
  </div>
  <footer>
    <span>{{ 'DASHBOARD.summaryCard.fromLastMonth' | translate }}</span>
    <strong [class.summary-card__trend--positive]="positive()">↗ {{ trend() }}</strong>
  </footer>
</article>
