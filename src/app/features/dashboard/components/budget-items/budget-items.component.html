<section class="budget">
  <header class="budget__header">
    <div class="budget__title">
      <span class="budget__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 9h16v12H4zM3 9l2-5h14l2 5M8 21v-6h4v6"/><path d="M3 9c0 2 4 2 4 0 0 2 4 2 4 0 0 2 4 2 4 0 0 2 4 2 4 0"/></svg>
      </span>
      <h2>{{ DASHBOARD.budgetItems.items }}</h2><i></i>
      <button type="button" [attr.aria-label]="DASHBOARD.budgetItems.expand"><svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-6 6M10 19H5v-5M5 19l6-6"/></svg></button>
    </div>
    <div class="budget__toolbar">
      <button type="button" class="budget__filter">{{ DASHBOARD.common.filter }}
        <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>
      </button>
      <label class="budget__search"><span class="visually-hidden">{{ DASHBOARD.budgetItems.searchLabel }}</span><input type="search" [placeholder]="DASHBOARD.common.search" />
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><kbd>K</kbd>
      </label>
    </div>
  </header>
  <div class="budget__content">
    <div class="budget__heading"><h3>{{ DASHBOARD.budgetItems.title }}</h3><p>{{ DASHBOARD.budgetItems.totalRevenue }} <bdi dir="ltr">$89,235.89</bdi></p></div>
    <app-bar-chart [items]="localizedMonths" />
    <div class="budget__legend"><i></i><span>2025</span></div>
  </div>
</section>
