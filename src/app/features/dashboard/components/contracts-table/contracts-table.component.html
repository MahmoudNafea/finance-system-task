<section class="contracts">
  <header class="contracts__header">
    <div class="contracts__title">
      <span class="contracts__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m5 8 7-4 7 4-7 4-7-4Zm0 4 7 4 7-4"/></svg>
      </span>
      <h2>{{ DASHBOARD.contracts.title }}</h2>
      <i aria-hidden="true"></i>
      <button type="button" [attr.aria-label]="DASHBOARD.contracts.expand">
        <svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-6 6M10 19H5v-5M5 19l6-6"/></svg>
      </button>
    </div>
    <div class="contracts__toolbar">
      <button type="button" class="contracts__filter">{{ DASHBOARD.common.filter }}
        <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>
      </button>
      <label class="contracts__search">
        <span class="visually-hidden">{{ DASHBOARD.contracts.searchLabel }}</span>
        <input type="search" [placeholder]="DASHBOARD.common.search" />
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <kbd>K</kbd>
      </label>
    </div>
  </header>

  <div class="contracts__table-wrap">
    <table>
    <thead>
      <tr>
        <th><button type="button" class="contracts__sort">{{ DASHBOARD.contracts.contractNumber }} <svg viewBox="0 0 16 16"><path d="m6 5 2-2 2 2M10 11l-2 2-2-2"/></svg></button></th>
        <th><button type="button" class="contracts__sort">{{ DASHBOARD.contracts.suppliers }} <svg viewBox="0 0 16 16"><path d="m6 5 2-2 2 2M10 11l-2 2-2-2"/></svg></button></th>
        <th><button type="button" class="contracts__sort">{{ DASHBOARD.common.date }} <svg viewBox="0 0 16 16"><path d="m6 5 2-2 2 2M10 11l-2 2-2-2"/></svg></button></th>
        <th><button type="button" class="contracts__sort">{{ DASHBOARD.contracts.status }} <svg viewBox="0 0 16 16"><path d="m6 5 2-2 2 2M10 11l-2 2-2-2"/></svg></button></th>
        <th class="contracts__actions-column"><span class="visually-hidden">{{ DASHBOARD.common.more }}</span></th>
      </tr>
    </thead>
    <tbody>
      @for (row of localizedRows; track row.id) {
        <tr>
          <td class="contracts__id">{{ row.id }}</td>
          <td><span class="contracts__supplier"><b class="contracts__logo {{ row.logoClass }}">{{ row.logo }}</b>{{ row.supplier }}</span></td>
          <td>{{ row.date }}</td>
          <td>
            <span class="contracts__progress-value">{{ row.progress }}%</span>
            <span class="contracts__progress"><i [style.width.%]="row.progress"></i></span>
          </td>
          <td class="contracts__actions-cell"><button class="contracts__more" type="button" [attr.aria-label]="DASHBOARD.common.more"><svg viewBox="0 0 20 20"><circle cx="10" cy="4" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="10" cy="16" r="1.5"/></svg></button></td>
        </tr>
      }
    </tbody>
    </table>
  </div>

  <footer><span>{{ DASHBOARD.common.viewMore }}</span><i aria-hidden="true">←</i></footer>
</section>
