<section class="budget" dir="rtl">
  <header class="budget__header">
    <div class="budget__title">
      <span class="budget__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 7h14v13H5zM8 4h8v3M9 11h2v2H9zm4 0h2v2h-2z"/></svg>
      </span>
      <h2>البنود</h2><i></i>
      <button type="button" aria-label="تكبير بنود الموازنة"><svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-6 6M10 19H5v-5M5 19l6-6"/></svg></button>
    </div>
    <div class="budget__toolbar">
      <button type="button" class="budget__filter">التصفية
        <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>
      </button>
      <label class="budget__search"><span class="visually-hidden">البحث في البنود</span><input type="search" placeholder="بحث" />
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><kbd>K</kbd>
      </label>
    </div>
  </header>
  <div class="budget__content">
    <div class="budget__heading"><h3>بنود الموازنة</h3><p>إجمالي الإيرادات: <strong>$89,235.89</strong></p></div>
    <div class="budget__chart">
      <div class="budget__axis"><span>1,000.00</span><span>800.00</span><span>600.00</span><span>400.00</span><span>200.00</span><span>0</span></div>
      <div class="budget__plot">
        @for (month of months; track month.label) {
          <div class="budget__column">
            <div class="budget__bar"><i [style.height.%]="month.base"></i><b [style.height.%]="month.top"></b></div>
            <span>{{ month.label }}</span>
          </div>
        }
      </div>
    </div>
    <div class="budget__legend"><i></i><span>2025</span></div>
  </div>
</section>
