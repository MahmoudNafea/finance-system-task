<header class="app-header" dir="rtl">
  <div class="app-header__primary">
    <div class="app-header__branding" aria-label="وزارة الداخلية - النظام المالي">
      <div class="app-header__ministry">
        <img
          class="app-header__logo"
          src="/assets/images/dashboard/moi-logo.jpeg"
          alt="وزارة الداخلية - Ministry of Interior - State of Qatar"
        />
      </div>

      <div class="app-header__system">
        <h1>النظام المالي</h1>
        <span class="app-header__divider" aria-hidden="true"></span>
        <span class="app-header__department">ادارة تطوير الأنظمة</span>
      </div>
    </div>

    <label class="app-header__search">
      <span class="visually-hidden">البحث في النظام</span>
      <span class="app-header__search-label">بحث</span>
      <input
        type="search"
        name="global-search"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        aria-label="البحث في النظام"
      />
      <span class="app-header__search-icon" aria-hidden="true"></span>
    </label>

    <div class="app-header__user-actions">
      <div class="app-header__profile">
        <span class="app-header__avatar" aria-hidden="true"></span>
        <span class="app-header__profile-copy">
          <strong>محمد عبد الله</strong>
          <small>قسم المالية</small>
        </span>
        <span class="app-header__chevron" aria-hidden="true">⌄</span>
      </div>

      <div class="app-header__quick-actions" aria-label="الإجراءات السريعة">
        <button type="button" aria-label="التقويم">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M7 3v4M17 3v4M3 9h18"></path>
            <path d="M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2M15 17h2"></path>
          </svg>
        </button>
        <button type="button" aria-label="الرسائل">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H10l-5 3v-3a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"></path>
            <path d="M8 10h8M8 14h5"></path>
          </svg>
        </button>
        <button type="button" aria-label="الوضع الداكن">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 15.2A9 9 0 0 1 8.8 3.5 9 9 0 1 0 20.5 15.2Z"></path>
          </svg>
        </button>
        <button type="button" aria-label="الإشعارات">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path>
            <path d="M10 21h4"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <nav class="app-header__breadcrumb" aria-label="مسار الصفحة">
    <a href="/dashboard">
      <svg class="app-header__home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9Z"></path>
      </svg>
      الرئيسية
    </a>
    <svg class="app-header__breadcrumb-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    <a href="#">المشتريات</a>
    <svg class="app-header__breadcrumb-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    <span aria-current="page">طلب شراء جديد</span>
  </nav>
</header>
